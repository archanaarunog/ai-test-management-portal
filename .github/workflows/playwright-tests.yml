name: Playwright Tests

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://localhost:5173
      BROWSER: chromium
      HEADLESS: "true"
      APP_USERNAME: archana.arun@aitestportal.dev
      APP_PASSWORD: Automate@123

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application
        run: nohup npm run preview -- --port 5173 --host 0.0.0.0 > app.log 2>&1 &

      - name: Wait for application
        run: npx wait-on http://localhost:5173 --timeout 60000

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: automation-framework/pom.xml

      - name: Install Playwright browsers
        working-directory: automation-framework
        run: mvn -B exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install chromium"

      - name: Run parallel UI tests
        working-directory: automation-framework
        run: mvn -B clean test -DsuiteXmlFile=src/test/resources/suites/testng-parallel.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            automation-framework/target/surefire-reports
            automation-framework/allure-results
          if-no-files-found: ignore

      - name: Get Allure history
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: automation-framework/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history